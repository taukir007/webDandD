<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Taukir</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>

    <nav class="navbar sticky-top navbar-expand-md navbar-light bg-light shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><img src="img/profile.png" alt="" class="logoimg"> Taukir</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarToggler">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="about.html">About</a>
                    <a class="nav-link" href="portfolio.html">Portfolio</a>
                    <a class="nav-link" href="service.html">Service</a>
                    <a class="nav-link active fw-bold" href="contact.html">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <header class="contact-header text-center text-white d-flex align-items-center justify-content-center">
        <h1 class="display-4 fw-bold">Get In Touch</h1>
    </header>

    <section class="py-5">
        <div class="container">
            <div class="row g-5">
                <div class="col-lg-4">
                    <h3 class="fw-bold mb-4">Contact Information</h3>
                    <div class="d-flex mb-3">
                        <i class="fa-solid fa-location-dot text-danger fs-4 me-3"></i>
                        <p>123 Street, Dhaka, Bangladesh</p>
                    </div>
                    <div class="d-flex mb-3">
                        <i class="fa-solid fa-phone text-success fs-4 me-3"></i>
                        <p>+880 1234 567 890</p>
                    </div>
                    <div class="d-flex mb-3">
                        <i class="fa-solid fa-envelope text-primary fs-4 me-3"></i>
                        <p>contact@taukir.com</p>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm p-4">
                        <form id="contactForm" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <input type="text" id="name" class="form-control" placeholder="Your Name" required>
                                </div>
                                <div class="col-md-6">
                                    <input type="email" id="email" class="form-control" placeholder="Email Address"
                                        required>
                                </div>
                                <div class="col-md-6">
                                    <input type="text" id="phone" class="form-control" placeholder="Phone Number"
                                        required>
                                </div>
                                <div class="col-md-6">
                                    <input type="text" id="address" class="form-control" placeholder="Address" required>
                                </div>
                                <div class="col-12">
                                    <textarea id="message" class="form-control" rows="5" placeholder="Your Message"
                                        required></textarea>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-dark w-100 py-2">Send Message</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="map-section">
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d116833.9533888631!2d90.33728800412854!3d23.780620650170464!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755b8b087026b81%3A0x8fa563bbdd5904c2!2sDhaka!5e0!3m2!1sen!2sbd!4v1700000000000!5m2!1sen!2sbd"
            width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </section>

    <footer class="bg-dark text-white text-center py-4">
        <p class="m-0">&copy; 2026 Taukir | <span id="datetime"></span></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/contact.js"></script>
</body>

</html>
